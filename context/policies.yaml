# Company policies — deny-by-default. Amount ceilings live in company.yaml (approval.amount_ceiling).
version: 1
updated: 2026-10-02

allowlist_domains:
  - localhost
  - 127.0.0.1
  - example.com

max_amount_auto_post: 1000.0   # <= this a write posts unattended; above it a human approves

# Redacted out of every memory write. Patterns are regex, matched with re.I.
pii_redact:
  - name: email
    pattern: '[\w.+-]+@[\w-]+\.[\w.-]+'
  - name: ssn
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
  - name: credit_card
    pattern: '\b(?:\d[ -]?){13,19}\b'
  - name: phone
    pattern: '\+?\d{1,3}[-.\s]?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'